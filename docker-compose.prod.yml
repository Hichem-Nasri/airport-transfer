# Production stack: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# TLS is expected to be terminated in front of the "web" service (reverse proxy, load balancer or Caddy/Traefik).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-airport_transfer}
      POSTGRES_USER: ${DB_USER:-airport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-airport} -d ${DB_NAME:-airport_transfer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-airport_transfer}
      DB_USER: ${DB_USER:-airport}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (32+ characters)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      CORS_ORIGINS: ${PUBLIC_URL}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@marhba.tn}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-80}:80"]

volumes:
  pgdata:
