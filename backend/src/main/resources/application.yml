spring:
  application:
    name: airport-transfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/airport_transfer}
    username: ${DB_USER:airport}
    password: ${DB_PASSWORD:airport}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
