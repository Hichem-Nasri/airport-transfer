spring:
  application:
    name: airport-transfer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/airport_transfer}
    username: ${DB_USER:airport}
    password: ${DB_PASSWORD:airport}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  messages:
    basename: messages
    # French is the default language: do not fall back to the server's own locale.
    fallback-to-system-locale: false
  web:
    locale: fr

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  jwt:
    # Dev-only default. Outside dev, always set JWT_SECRET (32+ characters); the prod profile refuses the default.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed-admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:noreply@marhba.tn}
