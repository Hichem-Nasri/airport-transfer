mail.booking.subject=Marhba - Your booking {0}
mail.booking.hello=Hello {0},\n\nThank you for your booking. Here is the summary:
mail.booking.leg=- {0}: {1}, airport {2}\n  Address: {3}\n  Pickup: {4} (Tunis time)\n  Price: {5}
mail.booking.footer=Your booking is awaiting confirmation. Pay the driver in cash.\nThe Marhba team
mail.direction.AIRPORT_TO_ADDRESS=From the airport to the address
mail.direction.ADDRESS_TO_AIRPORT=From the address to the airport

mail.status.confirmed.subject=Marhba - Booking {0} confirmed
mail.status.confirmed.body=Hello {0},\n\nYour booking is confirmed:\n\n{1}\n\nA driver will be assigned soon and you will receive another e-mail.\nThe Marhba team
mail.status.assigned.subject=Marhba - Driver assigned to booking {0}
mail.status.assigned.body=Hello {0},\n\nA driver has been assigned to your booking:\n\n{1}\n\nDriver: {2}\nPhone: {3}\n\nThe Marhba team
mail.status.completed.subject=Marhba - Thank you for your trip {0}
mail.status.completed.body=Hello {0},\n\nYour trip is complete:\n\n{1}\n\nThank you for choosing Marhba.
mail.status.cancelled.subject=Marhba - Booking {0} cancelled
mail.status.cancelled.body=Hello {0},\n\nYour booking has been cancelled:\n\n{1}{2}\n\nThe Marhba team
mail.status.reason=Reason: {0}
mail.driver.assigned.subject=Marhba - New trip {0}
mail.driver.assigned.body=Hello {0},\n\nA trip has been assigned to you:\n\n{1}\n\nCustomer: {2}\nPhone: {3}\nPassengers: {4}, luggage: {5}\n\nThe Marhba team
mail.driver.cancelled.subject=Marhba - Trip {0} cancelled
mail.driver.cancelled.body=Hello {0},\n\nThis trip has been cancelled:\n\n{1}\n\nThe Marhba team
mail.reset.subject=Marhba - Reset your password
mail.reset.body=Hello {0},\n\nYou asked to reset your password. Open this link (valid for 1 hour, single use):\n\n{1}\n\nIf you did not ask for this, just ignore this e-mail: your password stays the same.\n\nThe Marhba team

# API error messages (the "message" of an error response), one per stable error code.
error.AIRPORT_NOT_FOUND=Airport not found.
error.ALREADY_PAID=This booking is already paid.
error.AREA_NOT_FOUND=Governorate not found.
error.BAD_REQUEST=Invalid request.
error.BASE_CURRENCY_LOCKED=The base currency (TND) cannot be changed this way.
error.BASE_CURRENCY_NO_RATE=The dinar is the base currency: it has no rate.
error.BOOKING_NOT_ASSIGNABLE=Confirm the booking before assigning a driver.
error.BOOKING_NOT_EDITABLE=This booking can no longer be edited.
error.BOOKING_NOT_FOUND=Booking not found.
error.CANNOT_MODIFY_OWN_ACCESS=You cannot remove your own rights or disable your own account.
error.CONCURRENT_UPDATE=Someone else just changed this booking. Reload the page.
error.CURRENCY_ALREADY_EXISTS=This currency already exists.
error.CURRENCY_CODE_MISMATCH=The currency code does not match.
error.CURRENCY_NOT_FOUND=Currency not found.
error.CURRENCY_NOT_SUPPORTED=Unsupported currency.
error.CURRENT_PASSWORD_INVALID=The current password is incorrect.
error.DRIVER_HAS_ACTIVE_TRIPS=This driver still has assigned trips: reassign them first.
error.DRIVER_NOT_FOUND=Driver not found.
error.DRIVER_UNAVAILABLE=This driver already has a trip within 2 hours of this pickup.
error.EMAIL_ALREADY_USED=An account already exists with this e-mail.
error.EXCHANGE_RATE_NOT_FOUND=Exchange rate unavailable.
error.FORBIDDEN=You are not allowed to do this.
error.INVALID_CAPACITY=Maximum passengers must be at least the minimum.
error.INVALID_CREDENTIALS=Incorrect e-mail or password.
error.INVALID_RANGE=Invalid period (366 days at most).
error.INVALID_STATUS_TRANSITION=This booking can no longer be cancelled.
error.PAYMENT_METHOD_MISMATCH=This booking is not paid in cash.
error.PAYMENT_METHOD_NOT_AVAILABLE=This payment method is not available yet.
error.PAYMENT_NOT_COLLECTABLE=Cash can only be collected once the trip has started.
error.PICKUP_IN_PAST=The pickup time must be in the future.
error.RESET_TOKEN_INVALID=This link is invalid or has expired.
error.RETURN_BEFORE_OUTBOUND=The return must be after the first trip.
error.TARIFF_NOT_FOUND=No tariff for this trip.
error.TOO_MANY_REQUESTS=Too many attempts. Please try again later.
error.TRIP_NOT_FOUND=Trip not found.
error.UNAUTHORIZED=Please log in.
error.USER_NOT_FOUND=User not found.
error.VALIDATION_FAILED=Some fields are invalid.
error.VEHICLE_CAPACITY_EXCEEDED=This vehicle cannot carry that many passengers.
error.VEHICLE_TYPE_NOT_FOUND=Vehicle not found.
error.ZONE_NOT_FOUND=Destination not found.
error.CONFLICT=This operation conflicts with existing data (duplicate or still in use).
