# API error messages (the "message" of an error response), one per stable error code.
error.AIRPORT_NOT_FOUND=المطار غير موجود.
error.ALREADY_PAID=هذا الحجز مدفوع بالفعل.
error.AREA_NOT_FOUND=الولاية غير موجودة.
error.BAD_REQUEST=طلب غير صالح.
error.BASE_CURRENCY_LOCKED=لا يمكن تعديل العملة الأساسية بهذه الطريقة.
error.BASE_CURRENCY_NO_RATE=الدينار هو العملة الأساسية: لا يوجد له سعر صرف.
error.BOOKING_NOT_ASSIGNABLE=أكّد الحجز أولا قبل تعيين سائق.
error.BOOKING_NOT_EDITABLE=لم يعد ممكنًا تعديل هذا الحجز.
error.BOOKING_NOT_FOUND=الحجز غير موجود.
error.CANNOT_MODIFY_OWN_ACCESS=لا يمكنك إزالة صلاحياتك أو تعطيل حسابك.
error.CONCURRENT_UPDATE=قام شخص آخر بتعديل هذا الحجز للتو. أعد تحميل الصفحة.
error.CURRENCY_ALREADY_EXISTS=هذه العملة موجودة بالفعل.
error.CURRENCY_CODE_MISMATCH=رمز العملة غير مطابق.
error.CURRENCY_NOT_FOUND=العملة غير موجودة.
error.CURRENCY_NOT_SUPPORTED=عملة غير مدعومة.
error.CURRENT_PASSWORD_INVALID=كلمة المرور الحالية غير صحيحة.
error.DRIVER_HAS_ACTIVE_TRIPS=لدى هذا السائق رحلات مسندة: أعد إسنادها أولًا.
error.DRIVER_NOT_FOUND=السائق غير موجود.
error.DRIVER_UNAVAILABLE=لدى هذا السائق رحلة أخرى خلال ساعتين من موعد الاستلام.
error.EMAIL_ALREADY_USED=يوجد حساب بهذا البريد الإلكتروني بالفعل.
error.EXCHANGE_RATE_NOT_FOUND=سعر الصرف غير متوفر.
error.FORBIDDEN=غير مسموح لك بتنفيذ هذا الإجراء.
