error.INVALID_CREDENTIALS=البريد الإلكتروني أو كلمة المرور غير صحيحة.
error.INVALID_RANGE=فترة غير صالحة (366 يومًا كحد أقصى).
error.INVALID_STATUS_TRANSITION=لم يعد بالإمكان إلغاء هذا الحجز.
error.PAYMENT_METHOD_MISMATCH=لا يُدفع هذا الحجز نقدًا.
error.PAYMENT_METHOD_NOT_AVAILABLE=طريقة الدفع هذه غير متاحة بعد.
error.PAYMENT_NOT_COLLECTABLE=لا يمكن استلام المبلغ نقدًا إلا بعد بدء الرحلة.
error.PICKUP_IN_PAST=يجب أن يكون وقت الاستلام في المستقبل.
error.RESET_TOKEN_INVALID=هذا الرابط غير صالح أو انتهت صلاحيته.
error.RETURN_BEFORE_OUTBOUND=يجب أن تكون العودة بعد الرحلة الأولى.
error.TARIFF_NOT_FOUND=لا توجد تعرفة لهذه الرحلة.
error.TOO_MANY_REQUESTS=محاولات كثيرة جدًا. حاول مجددًا لاحقًا.
error.TRIP_NOT_FOUND=الرحلة غير موجودة.
error.UNAUTHORIZED=يرجى تسجيل الدخول.
error.USER_NOT_FOUND=المستخدم غير موجود.
error.VALIDATION_FAILED=بعض الحقول غير صالحة.
error.VEHICLE_CAPACITY_EXCEEDED=لا تتسع هذه المركبة لهذا العدد من الركاب.
error.VEHICLE_TYPE_NOT_FOUND=المركبة غير موجودة.
error.ZONE_NOT_FOUND=الوجهة غير موجودة.
error.CONFLICT=تتعارض هذه العملية مع بيانات موجودة (تكرار أو عنصر قيد الاستخدام).
